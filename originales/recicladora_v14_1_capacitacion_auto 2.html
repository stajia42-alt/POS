<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recicladora V14.1</title>

<style>
:root{
 --green:#176b3a;
 --green2:#21864b;
 --dark:#17202a;
 --bg:#f3f6f5;
 --card:#fff;
 --muted:#68757d;
 --border:#dce3df;
 --red:#c62828;
 --orange:#e58b00;
 --blue:#2468c7;
 --purple:#7257b8;
 --shadow:0 5px 22px #0000000d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
 margin:0;
 background:var(--bg);
 color:var(--dark);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

header{
 background:linear-gradient(135deg,var(--green),var(--green2));
 color:#fff;
 padding:calc(14px + env(safe-area-inset-top)) 14px 14px;
 position:sticky;
 top:0;
 z-index:30;
 box-shadow:0 3px 15px #0002;
}
.header{
 max-width:1150px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}
.header h1{
 margin:0;
 font-size:20px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}
.header p{margin:3px 0 0;font-size:11px;opacity:.82}
.header-right{text-align:right}
.user{
 display:inline-block;
 background:#ffffff20;
 border:1px solid #ffffff35;
 padding:6px 9px;
 border-radius:10px;
 font-size:11px;
}
.shift-badge{
 display:block;
 margin-top:5px;
 background:#ffffff22;
 padding:5px 8px;
 border-radius:9px;
 font-size:10px;
}

nav{
 position:sticky;
 top:73px;
 z-index:25;
 background:#fff;
 border-bottom:1px solid var(--border);
 display:flex;
 gap:6px;
 overflow-x:auto;
 padding:7px;
 scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
 border:0;
 background:#edf1ef;
 padding:9px 12px;
 border-radius:10px;
 white-space:nowrap;
 font-size:12px;
 font-weight:700;
}
nav button.active{background:var(--green);color:#fff}

main{
 max-width:1150px;
 margin:auto;
 padding:12px;
 padding-bottom:60px;
}
.card{
 background:var(--card);
 border-radius:17px;
 padding:15px;
 margin-bottom:12px;
 box-shadow:var(--shadow);
}
.card h2{font-size:18px;margin:0 0 12px}
.card h3{margin:0 0 10px}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
}
@media(min-width:750px){.grid{grid-template-columns:repeat(4,1fr)}}

.stat{
 background:#f1f6f3;
 border-radius:14px;
 padding:13px;
}
.stat span{display:block;color:var(--muted);font-size:11px}
.stat b{display:block;font-size:18px;margin-top:4px}

.quick-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
}
@media(min-width:650px){.quick-grid{grid-template-columns:repeat(4,1fr)}}

.quick{
 border:0;
 border-radius:16px;
 padding:15px 9px;
 background:#edf2ef;
 color:var(--dark);
 font-weight:800;
 min-height:92px;
}
.quick .icon{display:block;font-size:28px;margin-bottom:5px}
.quick.green{background:#e2f1e7;color:var(--green)}
.quick.blue{background:#e6effb;color:var(--blue)}
.quick.orange{background:#fff0d6;color:#8a5a00}
.quick.red{background:#fde8e8;color:var(--red)}
.quick.purple{background:#eee9fa;color:var(--purple)}

label{
 display:block;
 font-size:12px;
 font-weight:800;
 margin:10px 0 5px;
}
input,select,textarea{
 width:100%;
 padding:12px;
 border:1px solid var(--border);
 border-radius:11px;
 background:#fff;
 outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{min-height:80px}

.btn{
 border:0;
 border-radius:11px;
 padding:12px 14px;
 margin-top:9px;
 background:var(--green);
 color:#fff;
 font-weight:800;
}
.btn.full{width:100%}
.btn.secondary{background:#e9eeec;color:var(--dark)}
.btn.danger{background:var(--red)}
.btn.blue{background:var(--blue)}
.btn.orange{background:var(--orange)}
.btn.purple{background:var(--purple)}

.actions{display:flex;flex-wrap:wrap;gap:7px}
.actions .btn{margin-top:5px}

.notice{
 padding:11px;
 border-radius:11px;
 background:#fff5dc;
 color:#735500;
 font-size:12px;
 margin:9px 0;
}
.success{
 padding:11px;
 border-radius:11px;
 background:#e5f4e9;

 font-size:12px;
}
.small{font-size:11px;color:var(--muted)}
.money{font-weight:900}

.row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 padding:11px 0;
 border-bottom:1px solid #edf0ef;
}
.row:last-child{border-bottom:0}

.badge{
 display:inline-block;
 padding:5px 8px;
 border-radius:8px;
 background:#e8f3ec;
 color:var(--green);

 font-weight:800;
}
.badge.low{background:#fff0d5;color:#8a5a00}
.badge.red{background:#fde7e7;color:var(--red)}
.badge.blue{background:#e7effb;color:var(--blue)}

.empty{
 text-align:center;
 padding:22px 10px;
 color:var(--muted);

}

.total-box{
 background:linear-gradient(135deg,#17202a,#263441);
 color:#fff;
 border-radius:16px;
 padding:16px;
 margin-top:11px;
}
.total-box small{opacity:.65;font-size:10px}
.total-box strong{display:block;font-size:28px;margin-top:3px}

.material-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-top:9px;
}
@media(min-width:650px){.material-grid{grid-template-columns:repeat(4,1fr)}}

.material-btn{
 border:2px solid transparent;
 background:#f1f4f3;
 border-radius:14px;
 padding:11px 7px;
 min-height:84px;
 text-align:center;
}
.material-btn.selected{

 background:#e3f1e8;
}
.material-icon{display:block;font-size:25px;margin-bottom:3px}
.material-name{display:block;font-weight:800;font-size:12px}
.material-price{display:block;color:var(--muted);font-size:10px;margin-top:3px}

.category-bar{
 display:flex;
 gap:6px;

}
.category{

 padding:8px 11px;

}
.category.active{background:var(--green);color:#fff}

.cart{

}
.cart-item{

}
.cart-item:last-child{border-bottom:0}
.cart-top{

}
.cart-name{font-weight:900}
.cart-controls{

 align-items:center;
 gap:7px;
 margin-top:8px;
}
.kg-input{
 width:100px;
 padding:8px;
}
.icon-btn{
 border:0;
 border-radius:9px;
 padding:8px 10px;
 background:#edf1ef;
}
.icon-btn.danger{background:#fde8e8;color:var(--red)}

.sticky-total{
 position:sticky;
 bottom:8px;
 z-index:10;
 margin-top:10px;
 background:#fff;
 border:1px solid var(--border);
 border-radius:16px;
 padding:11px;
 box-shadow:0 6px 25px #0002;
}

.payment-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}
.payment-btn{
 border:2px solid #e2e7e4;
 border-radius:13px;
 background:#fff;
 padding:13px 8px;
 font-weight:800;
}
.payment-btn.active{
 border-color:var(--green);
 background:#e3f1e8;
 color:var(--green);
}

.modal{
 position:fixed;
 inset:0;
 z-index:100;
 background:#0008;
 display:flex;
 align-items:flex-end;
 justify-content:center;
}
.modal-box{
 width:100%;
 max-width:650px;
 max-height:92vh;
 overflow:auto;
 background:#fff;
 border-radius:22px 22px 0 0;
 padding:19px;
}
.modal-actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:10px;
}
.modal-actions button{margin:0}

.login{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:linear-gradient(135deg,#eaf3ed,#f5f7f6);
}
.login-card{
 width:100%;
 max-width:420px;
 background:#fff;
 padding:25px;
 border-radius:24px;
 box-shadow:0 15px 45px #00000014;
 text-align:center;
}
.logo{
 width:72px;
 height:72px;
 margin:auto auto 12px;
 border-radius:20px;
 background:var(--green);
 color:#fff;
 display:flex;
 justify-content:center;
 align-items:center;
 font-size:36px;
 overflow:hidden;
}
.logo img{width:100%;height:100%;object-fit:contain}

.shift-card{
 border:2px solid #e1e9e4;
 background:#f8faf9;
 border-radius:16px;
 padding:14px;
 margin-bottom:10px;
}
.shift-open{
 border-color:#5baa76;
 background:#eaf6ee;
}

.table-wrap{overflow:auto}
table{width:100%;min-width:700px;border-collapse:collapse}
th,td{
 text-align:left;
 padding:9px;
 border-bottom:1px solid #eee;
 font-size:12px;
}
th{background:#f6f8f7}

.ticket{

}
.ticket-center{text-align:center}
.ticket-line{border-top:1px dashed #000;margin:7px 0}
.ticket-row{display:flex;justify-content:space-between;gap:5px}
.ticket-total{font-size:16px;font-weight:bold}
.logo-ticket{max-width:55mm;max-height:25mm;object-fit:contain;margin-bottom:4px}

@media print{
 body *{visibility:hidden!important}
 #printArea,#printArea *{visibility:visible!important}
 #printArea{position:absolute;left:0;top:0;width:80mm}
 @page{size:80mm auto;margin:0}
}

/* CAPACITACION INTERACTIVA */
.training-wrap{max-width:1120px;margin:0 auto}
.training-welcome{background:linear-gradient(135deg,#fff,#edf9f1);border:1px solid #dcefe2}
.training-label{font-size:12px;font-weight:900;letter-spacing:.8px;color:#168344;margin-bottom:8px}
.training-welcome h1{margin:0 0 8px;font-size:30px}.training-welcome p{margin:0;color:#59625e}
.training-overall,.training-bar{height:9px;background:#e7ece9;border-radius:99px;overflow:hidden;margin:18px 0 7px}
.training-overall span,.training-bar span{display:block;height:100%;background:#20a458;border-radius:99px;transition:width .3s}
.training-overall-text{font-size:12px;color:#68716d}
.training-module-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin:12px 0}
.training-module{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid #dfe5e2;background:#fff;border-radius:14px;padding:11px;cursor:pointer}

.training-module.completed{background:#f2fbf5}.tm-icon{font-size:25px}

.training-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}

.training-head h2{margin:4px 0}.training-head p{margin:0;color:#68716d}
.training-step-count{font-weight:900;font-size:18px;background:#f1f5f3;border-radius:12px;padding:9px 12px}
.training-instruction{display:flex;gap:18px;padding:24px;background:#f8faf9;border:1px solid #e2e8e4;border-radius:18px}
.training-big-number{min-width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#20a458;color:#fff;font-size:23px;font-weight:900}
.training-action{font-size:11px;font-weight:900;color:#168344;letter-spacing:.6px}
.training-copy h3{font-size:24px;margin:4px 0 9px}.training-copy p{font-size:16px;line-height:1.6;margin:0}
.training-tip{margin-top:15px;padding:12px 14px;background:#fff;border-left:4px solid #20a458;border-radius:8px;line-height:1.5}

.training-nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.training-checklist{margin-top:12px}.training-checklist h3{margin-top:0}
.check-row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px}
.check-row>span{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#e8eeea;font-weight:800}
.check-row.current{background:#f0faf3}.check-row.current>span,.check-row.past>span{background:#20a458;color:#fff}
.check-row small{display:block;color:#747d78;margin-top:2px}
.training-quiz{text-align:center}.quiz-question{font-size:19px;font-weight:700;line-height:1.5;margin:18px 0}
.training-answer{margin:15px 0;padding:15px;text-align:left;background:#effaf3;border:1px solid #ccebd6;border-radius:12px;line-height:1.6}
@media(max-width:650px){.training-welcome h1{font-size:24px}.training-module-grid{grid-template-columns:1fr 1fr}.training-instruction{padding:18px;gap:12px}.training-copy h3{font-size:20px}.training-practice-box,.training-head{flex-direction:column}.training-practice-box .btn,.training-nav button{width:100%}.training-nav{flex-direction:column-reverse}}


.first-login-tutorial{text-align:center;max-width:520px;margin:auto;padding:8px}
.first-login-icon{font-size:54px;margin-bottom:8px}
.first-login-tutorial h2{margin:4px 0 10px;font-size:25px}
.first-login-tutorial p{line-height:1.6;color:#626b67}
.first-login-options{display:grid;gap:10px;margin-top:20px}
.first-login-options button{width:100%}

</style>
</head>

<body>

<section id="loginScreen" class="login">
 <div class="login-card">
  <div class="logo" id="loginLogo">♻️</div>
  <h1 id="loginBusiness">Mi Recicladora</h1>
  <p class="small">Sistema POS V14.1</p>
  <div id="loginUsers"></div>
  <label>PIN</label>
  <input id="loginPin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN">
  <button class="btn full" onclick="login()">Entrar</button>
  <button class="btn secondary full" onclick="quickSetup()">Configurar sistema</button>
 </div>
</section>

<section id="appScreen" class="hidden">

<header>
 <div class="header">
  <div>
   <h1 id="headerBusiness">Mi Recicladora</h1>
   <p id="headerSubtitle">Sistema POS</p>
  </div>
  <div class="header-right">
   <div class="user" id="headerUser"></div>
   <div class="shift-badge" id="headerShift"></div>
  </div>
 </div>
</header>

<nav id="nav"></nav>
<main id="app"></main>
</section>

<div id="modal" class="modal hidden" onclick="closeModal(event)">
 <div id="modalContent" class="modal-box" onclick="event.stopPropagation()"></div>
</div>

<div id="printArea"></div>

<script>
const KEY="RECICLADORA_V14";

const DEFAULT_DB={
 business:{
  name:"Mi Recicladora",
  address:"",
  phone:"",
  taxId:"",
  message:"Gracias por su preferencia.",
  logo:"",
  paper:"80mm"
 },
 users:[
  {id:"owner",name:"Administrador",pin:"1234",role:"Administrador"}
 ],
 materials:[],
 purchases:[],
 sales:[],
 expenses:[],
 adjustments:[],
 inventoryMoves:[],
 cashCuts:[],
 cashMoves:[],
 shifts:[],
 settings:{nextTicket:1},
 currentShift:null
};

function clone(x){return JSON.parse(JSON.stringify(x))}

function loadDB(){
 try{
  const s=localStorage.getItem(KEY);
  if(!s)return clone(DEFAULT_DB);
  const d=JSON.parse(s);
  return {
   ...clone(DEFAULT_DB),
   ...d,
   business:{...clone(DEFAULT_DB.business),...(d.business||{})},
   settings:{...clone(DEFAULT_DB.settings),...(d.settings||{})},
   users:d.users||[],
   materials:d.materials||[],
   purchases:d.purchases||[],
   sales:d.sales||[],
   expenses:d.expenses||[],
   adjustments:d.adjustments||[],
   inventoryMoves:d.inventoryMoves||[],
   cashCuts:d.cashCuts||[],
   cashMoves:d.cashMoves||[],
   shifts:d.shifts||[],
   currentShift:d.currentShift||null
  };
 }catch(e){return clone(DEFAULT_DB)}
}

let db=loadDB();
let currentUser=null;
let page="inicio";
let selectedMaterial=null;
let operationCategory="Todos";
let buyCart=[];
let buyPayment="Efectivo";

const pages={
 inicio:"Inicio",
 compras:"Comprar",
 ventas:"Vender",
 inventario:"Inventario",
 caja:"Caja",
 gastos:"Gastos",
 reportes:"Reportes",
 materiales:"Materiales",
 negocio:"Mi negocio",
 usuarios:"Usuarios",
 respaldo:"Respaldo",
 tutorial:"Tutorial"
};

const categories={
 Metal:["Fierro","Cobre","Cobre brillante","Cobre mixto","Bronce","Aluminio","Lata de aluminio","Chatarra"],
 Plastico:["PET","PET cristal","PET verde","Plástico"],
 Papel:["Cartón","Cartón de primera","Cartón de segunda","Archivo","Papel","Periódico"],
 Otros:[]
};

const icons={
 Fierro:"🔩",Cobre:"🟠","Cobre brillante":"✨","Cobre mixto":"🟤",Bronce:"🟫",
 Aluminio:"🥫","Lata de aluminio":"🥫",Chatarra:"⚙️",PET:"🥤",
 "PET cristal":"💧","PET verde":"🟢","Plástico":"♻️",Cartón:"📦",
 "Cartón de primera":"📦","Cartón de segunda":"📦",Archivo:"📄",
 Papel:"📄",Periódico:"📰"
};

const common=[
 "Cartón","Cartón de primera","Cartón de segunda","PET","PET cristal","PET verde",
 "Aluminio","Lata de aluminio","Fierro","Cobre","Cobre brillante","Cobre mixto",
 "Bronce","Archivo","Papel","Periódico","Plástico","Chatarra"
];

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(){
 if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
 return Date.now()+"_"+Math.random();
}
function money(n){
 return new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"}).format(Number(n)||0);
}
function esc(s){
 return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function dateTime(d){return new Date(d).toLocaleString("es-MX")}
function dateOnly(d){return new Date(d).toLocaleDateString("es-MX")}
function todayStart(){
 const d=new Date();d.setHours(0,0,0,0);return d;
}
function todayEnd(){
 const d=new Date();d.setHours(23,59,59,999);return d;
}

function getCategory(name){
 for(const c of Object.keys(categories)){
  if(categories[c].some(x=>x.toLowerCase()===name.toLowerCase()))return c;
 }
 return "Otros";
}

function inventory(){
 const r={};
 db.materials.forEach(m=>r[m.id]=Number(m.initial)||0);
 db.purchases.forEach(x=>{
  (x.items||[{mid:x.mid,kg:x.kg}]).forEach(i=>{
   r[i.mid]=(r[i.mid]||0)+Number(i.kg||0);
  });
 });
 db.sales.forEach(x=>r[x.mid]=(r[x.mid]||0)-Number(x.kg||0));
 db.adjustments.forEach(x=>r[x.mid]=(r[x.mid]||0)+Number(x.delta||0));
 return r;
}

function currentShift(){
 return db.currentShift;
}

function requireShift(){
 if(!db.currentShift){
  alert("Debes abrir un turno antes de realizar esta operación.");
  page="caja";
  render();
  return false;
 }
 return true;
}

function shiftId(){return db.currentShift?.id||""}

function shiftFilter(arr){
 const s=db.currentShift;
 if(!s)return [];
 return arr.filter(x=>x.shiftId===s.id);
}

function render(){
 renderNav();
 renderHeader();

 if(page==="inicio")renderInicio();
showFirstLoginTutorialChoice();
 if(page==="compras")renderCompra();
 if(page==="ventas")renderVenta();
 if(page==="inventario")renderInventario();
 if(page==="caja")renderCaja();
 if(page==="gastos")renderGastos();
 if(page==="reportes")renderReportes();
 if(page==="materiales")renderMateriales();
 if(page==="negocio")renderNegocio();
 if(page==="usuarios")renderUsuarios();
 if(page==="respaldo")renderRespaldo();
  if(page==="tutorial")renderTutorial();
}

function go(p){
 page=p;
 selectedMaterial=null;
 render();
}

function renderNav(){
 document.getElementById("nav").innerHTML=
 Object.entries(pages).map(([k,v])=>
 `<button class="${page===k?"active":""}" onclick="go('${k}')">${v}</button>`
 ).join("")+
 `<button onclick="logout()">Salir</button>`;
}

function renderHeader(){
 document.getElementById("headerBusiness").textContent=db.business.name||"Mi Recicladora";

function loadLogin(){
 document.getElementById("loginBusiness").textContent=db.business.name||"Mi Recicladora";

 logo.innerHTML=db.business.logo?`<img src="${db.business.logo}">`:"♻️";

 <select id="loginUser">
 ${db.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}
 </select>`;
}

function login(){
 const id=document.getElementById("loginUser")?.value;
 const pin=document.getElementById("loginPin").value;
 const u=db.users.find(x=>x.id===id);
 if(!u)return alert("Selecciona un usuario.");
 if(u.pin!==pin)return alert("PIN incorrecto.");
 currentUser=u;
 document.getElementById("loginScreen").classList.add("hidden");
 document.getElementById("appScreen").classList.remove("hidden");
 render();
 if(!db.currentShift)openShift();
}

function logout(){
 currentUser=null;
 document.getElementById("appScreen").classList.add("hidden");
 document.getElementById("loginScreen").classList.remove("hidden");
 document.getElementById("loginPin").value="";
 loadLogin();
}

function quickSetup(){

 page="negocio";

}

 const dollars=sales.filter(x=>x.payment==="Dólares").reduce((a,x)=>a+x.dollarsReceived,0);

 document.getElementById("app").innerHTML=`

    <div class="small" style="margin-top:5px">
     ${esc(db.currentShift.userName)} · ${dateTime(db.currentShift.openedAt)}
     <br>Fondo: ${money(db.currentShift.openingCash)}

  <div class="stat"><span>🛒 Compras del turno</span><b>${money(buyTotal)}</b></div>
  <div class="stat"><span>💸 Gastos</span><b>${money(expenseTotal)}</b></div>
  <div class="stat"><span>📦 Inventario</span><b>${stock.toLocaleString()} kg</b></div>
  <div class="stat"><span>💵 Efectivo esperado</span><b>${money(cashExpected())}</b></div>
  <div class="stat"><span>💲 Dólares recibidos</span><b>$${dollars.toFixed(2)}</b></div>

 <div class="card">
  <h2>Acciones rápidas</h2>
  <div class="quick-grid">
   <button class="quick green" onclick="go('compras')"><span class="icon">🛒</span>Comprar</button>
   <button class="quick blue" onclick="go('ventas')"><span class="icon">💰</span>Vender</button>

/* MATERIAL PICKER */

function materialPicker(mode){
 const materials=db.materials.filter(m=>
  operationCategory==="Todos"||getCategory(m.name)===operationCategory
 );
 return `
 <div class="category-bar">
 ${["Todos","Metal","Plastico","Papel","Otros"].map(c=>
 `<button class="category ${operationCategory===c?"active":""}" onclick="setCategory('${mode}','${c}')">${c}</button>`
 ).join("")}
 </div>
 <input id="${mode}Search" placeholder="🔎 Buscar material..." oninput="filterMaterials('${mode}')">
 <div id="${mode}Materials" class="material-grid">
 ${materials.map(m=>materialButton(m,mode)).join("")}
 </div>`;
}

function materialButton(m,mode){
 const selected=selectedMaterial===m.id;
 const price=mode==="buy"?m.price:m.salePrice;
 return `
 <button class="material-btn ${selected?"selected":""}"
  data-name="${esc(m.name.toLowerCase())}"
  onclick="selectMaterial('${m.id}','${mode}')">
  <span class="material-icon">${icons[m.name]||"♻️"}</span>
  <span class="material-name">${esc(m.name)}</span>
  <span class="material-price">${money(price)}/kg</span>
 </button>`;
}

function setCategory(mode,c){
 operationCategory=c;
 render();
}
function filterMaterials(mode){
 const q=document.getElementById(mode+"Search").value.toLowerCase();
 document.querySelectorAll("#"+mode+"Materials .material-btn").forEach(b=>{
  b.style.display=b.dataset.name.includes(q)?"block":"none";
 });
}
function selectMaterial(id,mode){
 selectedMaterial=id;
 render();
 setTimeout(()=>{
  const el=document.getElementById(mode==="buy"?"buyKg":"saleKg");
  if(el)el.focus();
 },80);
}

  ${db.materials.length?materialPicker("buy"):`<div class="empty">Primero agrega materiales.</div>`}

  ${selectedMaterial?`

    <b>${esc(db.materials.find(x=>x.id===selectedMaterial)?.name||"Material")}</b>
    <div class="small">Precio fijo: ${money(db.materials.find(x=>x.id===selectedMaterial)?.price||0)}/kg</div>
    <div style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end">
     <div>
      <label>Kilos</label>
      <input id="buyKg" type="number" inputmode="decimal" min="0" step=".001" placeholder="0.000">
     </div>
     <button class="btn" onclick="addToBuyCart()">➕ Agregar</button>
    </div>
   </div>`:""}
 </div>

 <div class="card">
  <h2>📋 Carrito de compra</h2>
  ${buyCart.length?buyCartHTML():`
   <div class="empty">
    Selecciona un material, indica los kilos y presiona<br>
    <b>Agregar</b>.
   </div>`}
 </div>
 `;

function addToBuyCart(){
 if(!requireShift())return;
 const m=db.materials.find(x=>x.id===selectedMaterial);
 const kg=Number(document.getElementById("buyKg")?.value)||0;
 if(!m||kg<=0)return alert("Selecciona un material y escribe los kilos.");
 const existing=buyCart.find(x=>x.mid===m.id);
 if(existing)existing.kg+=kg;
 else buyCart.push({mid:m.id,kg});
 selectedMaterial=null;
 save();
 render();
}

function buyCartHTML(){
 let total=0;
 const rows=buyCart.map((x,i)=>{
  const m=db.materials.find(z=>z.id===x.mid);
  const subtotal=x.kg*(Number(m?.price)||0);
  total+=subtotal;
  return `
  <div class="cart-item">
   <div class="cart-top">
    <div>
     <div class="cart-name">${icons[m?.name]||"♻️"} ${esc(m?.name||"Material")}</div>
     <div class="small">${money(m?.price||0)} por kg</div>
    </div>
    <b>${money(subtotal)}</b>
   </div>
   <div class="cart-controls">
    <input class="kg-input" type="number" min="0" step=".001" value="${x.kg}"
     onchange="editCartKg(${i},this.value)">
    <span class="small">kg</span>
    <button class="icon-btn danger" onclick="removeCartItem(${i})">🗑️</button>
   </div>
  </div>`;
 }).join("");

 return `
 <div class="cart">${rows}</div>

 <div class="sticky-total">
  <div style="display:flex;justify-content:space-between;align-items:center">
   <span class="small">TOTAL DE COMPRA</span>
   <strong style="font-size:25px">${money(total)}</strong>
  </div>

  <label>Forma de pago</label>
  <div class="payment-grid">
   <button class="payment-btn ${buyPayment==="Efectivo"?"active":""}" onclick="setBuyPayment('Efectivo')">💵 Efectivo</button>
   <button class="payment-btn ${buyPayment==="Transferencia"?"active":""}" onclick="setBuyPayment('Transferencia')">🏦 Transferencia</button>
  </div>

  <button class="btn full" onclick="confirmPurchase()">✅ Confirmar compra</button>
  <button class="btn secondary full" onclick="clearBuyCart()">Vaciar compra</button>
 </div>`;
}

function editCartKg(i,value){
 const kg=Number(value)||0;
 if(kg<=0)return alert("Los kilos deben ser mayores a cero.");
 buyCart[i].kg=kg;
 render();
}
function removeCartItem(i){
 buyCart.splice(i,1);
 render();
}
function clearBuyCart(){
 if(!buyCart.length)return;
 if(confirm("¿Vaciar toda la compra?")){
  buyCart=[];
  render();
 }
}
function setBuyPayment(p){
 buyPayment=p;
 render();
}

function buyCartTotal(){
 return buyCart.reduce((a,x)=>{
  const m=db.materials.find(z=>z.id===x.mid);
  return a+x.kg*(Number(m?.price)||0);
 },0);
}

function confirmPurchase(){
 if(!requireShift())return;
 if(!buyCart.length)return alert("Agrega al menos un material.");
 const total=buyCartTotal();

 const detail=buyCart.map(x=>{
  const m=db.materials.find(z=>z.id===x.mid);
  return `${m.name}: ${x.kg} kg × ${money(m.price)} = ${money(x.kg*m.price)}`;
 }).join("\n");

 openModal(`
  <h2>Confirmar compra</h2>
  <div class="notice"><b>Revisa antes de registrar.</b></div>
  <div style="white-space:pre-line;font-size:13px;line-height:1.6">${esc(detail)}</div>
  <div class="total-box">
   <small>TOTAL A PAGAR</small>
   <strong>${money(total)}</strong>
  </div>
  <p class="small">Pago: <b>${buyPayment}</b></p>
  <div class="modal-actions">
   <button class="btn secondary" onclick="closeModal()">Cancelar</button>
   <button class="btn" onclick="registerPurchase()">Confirmar compra</button>
  </div>
 `);
}

function registerPurchase(){
 const total=buyCartTotal();
 const date=new Date().toISOString();

 const purchase={
  id:uid(),
  items:buyCart.map(x=>({
   mid:x.mid,
   kg:x.kg,
   price:Number(db.materials.find(m=>m.id===x.mid)?.price)||0,
   subtotal:x.kg*(Number(db.materials.find(m=>m.id===x.mid)?.price)||0)
  })),
  total,
  payment:buyPayment,
  date,
  shiftId:shiftId(),
  user:currentUser?.id||"",
  userName:currentUser?.name||""
 };

 db.purchases.push(purchase);

 purchase.items.forEach(item=>{
  const before=inventory()[item.mid];
  db.inventoryMoves.push({
   id:uid(),
   mid:item.mid,
   type:"Compra",
   delta:item.kg,
   before,
   after:before+item.kg,
   reason:"Compra de material",
   date,
   user:currentUser?.id||"",
   userName:currentUser?.name||"",
   shiftId:shiftId()
  });
 });

 save();
 buyCart=[];
 buyPayment="Efectivo";
 closeModal();
 alert("Compra registrada correctamente.");
 render();
}

  </div>
  <div id="dollarInfo"></div>

function selectPayment(p){
 const input=document.getElementById("salePayment");
 if(!input)return;
 input.value=p;
 ["Efectivo","Transferencia","Tarjeta","Dólares"].forEach(x=>{
  const id="pay"+x.replace("ó","o");
  document.getElementById(id)?.classList.toggle("active",x===p);
 });
 document.getElementById("dollarFields")?.classList.toggle("hidden",p!=="Dólares");
 updateDollarSale();
}

function updateSaleTotal(){
 const m=db.materials.find(x=>x.id===selectedMaterial);
 const kg=Number(document.getElementById("saleKg")?.value)||0;
 if(m)document.getElementById("saleTotal").textContent=money(kg*m.salePrice);
 updateDollarSale();
}

function updateDollarSale(){
 const payment=document.getElementById("salePayment")?.value;
 if(payment!=="Dólares")return;
 const total=Number((document.getElementById("saleKg")?.value||0))*
             Number(db.materials.find(x=>x.id===selectedMaterial)?.salePrice||0);
 const dollars=Number(document.getElementById("dollarsReceived")?.value)||0;
 const rate=Number(db.currentShift?.exchangeRate)||0;
 const received=dollars*rate;
 const change=received-total;
 const box=document.getElementById("dollarInfo");
 if(box)box.innerHTML=`
 <div class="${change>=0?"success":"notice"}">
  Equivalente: <b>${money(received)}</b><br>
  ${change>=0?"Cambio en pesos: "+money(change):"Faltan: "+money(Math.abs(change))}
 </div>`;
}

function confirmSale(){
 if(!requireShift())return;
 const m=db.materials.find(x=>x.id===selectedMaterial);
 const kg=Number(document.getElementById("saleKg")?.value)||0;
 const I=inventory();
 if(!m||kg<=0)return alert("Selecciona material y cantidad.");
 if(kg>(I[m.id]||0))return alert("No tienes suficiente inventario.");

 const payment=document.getElementById("salePayment").value;
 const total=kg*Number(m.salePrice||0);

 let dollarsReceived=0,change=0;
 if(payment==="Dólares"){
  dollarsReceived=Number(document.getElementById("dollarsReceived").value)||0;
  const received=dollarsReceived*Number(db.currentShift.exchangeRate||0);
  change=received-total;
  if(dollarsReceived<=0||change<0)return alert("Los dólares recibidos no cubren el total.");
 }

 openModal(`
 <h2>Confirmar venta</h2>
 <div class="success">
  <b>${esc(m.name)}</b><br>
  ${kg.toLocaleString()} kg × ${money(m.salePrice)}
 </div>
 <div class="total-box">
  <small>TOTAL</small>
  <strong>${money(total)}</strong>
 </div>
 <p class="small">Pago: <b>${payment}</b>
 ${payment==="Dólares"?`<br>Dólares recibidos: $${dollarsReceived.toFixed(2)}<br>Cambio: ${money(change)}`:""}</p>
 <div class="modal-actions">
  <button class="btn secondary" onclick="closeModal()">Cancelar</button>
  <button class="btn" onclick="registerSale(${JSON.stringify(payment)},${kg},${dollarsReceived},${change})">Confirmar venta</button>
 </div>
 `);
}

function registerSale(payment,kg,dollarsReceived,change){
 const m=db.materials.find(x=>x.id===selectedMaterial);
 const total=kg*Number(m.salePrice||0);
 const before=inventory()[m.id];
 const sale={
  id:uid(),mid:m.id,kg,price:Number(m.salePrice)||0,total,
  customer:document.getElementById("saleCustomer")?.value.trim()||"",
  payment,
  dollarsReceived,
  exchangeRate:payment==="Dólares"?Number(db.currentShift.exchangeRate):0,
  change,
  ticket:db.settings.nextTicket++,
  date:new Date().toISOString(),
  user:currentUser?.id||"",
  userName:currentUser?.name||"",
  shiftId:shiftId()
 };
 db.sales.push(sale);
 db.inventoryMoves.push({
  id:uid(),mid:m.id,type:"Venta",delta:-kg,before,after:before-kg,
  reason:"Venta de material",date:sale.date,
  user:currentUser?.id||"",userName:currentUser?.name||"",shiftId:shiftId()
 });
 save();
 selectedMaterial=null;
 closeModal();
 render();
 if(confirm("Venta registrada. ¿Imprimir ticket?"))printTicket(sale.id);
}

function inventoryAdjust(id){
 const m=db.materials.find(x=>x.id===id);
 const I=inventory();
 openModal(`
 <h2>Ajustar inventario</h2>
 <div class="notice">${esc(m.name)} · Actual: <b>${(I[id]||0).toLocaleString()} kg</b></div>
 <label>Material</label>
 <select id="adjMaterial" onchange="refreshAdjustmentMaterial()">
 ${db.materials.map(x=>`<option value="${x.id}" ${x.id===id?"selected":""}>${esc(x.name)}</option>`).join("")}
 </select>
 <label>Tipo</label>
 <select id="adjType">
  <option value="add">➕ Agregar</option>
  <option value="remove">➖ Retirar</option>
  <option value="set">📦 Establecer cantidad</option>
 </select>
 <label>Cantidad</label>
 <input id="adjKg" type="number" inputmode="decimal" min="0" step=".001">
 <label>Motivo</label>
 <input id="adjReason" placeholder="Conteo físico, merma, etc.">
 <button class="btn full" onclick="confirmAdjustment()">Continuar</button>
 `);
}

function refreshAdjustmentMaterial(){}

function confirmAdjustment(){
 const id=document.getElementById("adjMaterial").value;
 const type=document.getElementById("adjType").value;
 const amount=Number(document.getElementById("adjKg").value)||0;
 const reason=document.getElementById("adjReason").value.trim();
 if(amount<0||!reason)return alert("Completa los datos.");
 const I=inventory();
 let delta=type==="remove"?-amount:type==="set"?amount-(I[id]||0):amount;
 const m=db.materials.find(x=>x.id===id);
 openModal(`
 <h2>Confirmar ajuste</h2>
 <div class="notice">${esc(m.name)}<br>${delta>=0?"+":""}${delta.toLocaleString()} kg</div>
 <p>Inventario: <b>${(I[id]||0).toLocaleString()} kg → ${(I[id]+delta).toLocaleString()} kg</b></p>
 <p class="small">Motivo: ${esc(reason)}</p>
 <div class="modal-actions">
  <button class="btn secondary" onclick="closeModal()">Cancelar</button>
  <button class="btn" onclick="saveAdjustment('${id}',${delta},${JSON.stringify(type)},${JSON.stringify(reason)})">Confirmar</button>
 </div>`);
}

function saveAdjustment(id,delta,type,reason){
 const before=inventory()[id];
 db.adjustments.push({
  id:uid(),mid:id,delta,type,amount:Math.abs(delta),reason,
  date:new Date().toISOString(),user:currentUser?.id||"",
  userName:currentUser?.name||"",shiftId:shiftId()
 });

function cashExpected(){
 const s=db.currentShift;
 if(!s)return 0;
 const sales=shiftFilter(db.sales).filter(x=>x.payment==="Efectivo").reduce((a,x)=>a+x.total,0);
 const expenses=shiftFilter(db.expenses).filter(x=>x.payment==="Efectivo").reduce((a,x)=>a+x.amount,0);
 const moves=shiftFilter(db.cashMoves).reduce((a,x)=>a+x.amount,0);
 return Number(s.openingCash)+sales-expenses+moves;
}

function cashMove(sign){
 if(!requireShift())return;
 const amount=Number(prompt(sign>0?"Cantidad de entrada:":"Cantidad de salida:"))||0;
 if(amount<=0)return;
 const reason=prompt("Motivo:");
 if(!reason)return;
 if(sign<0&&amount>cashExpected())return alert("La salida supera el efectivo esperado.");
 db.cashMoves.push({
  id:uid(),amount:amount*sign,reason,date:new Date().toISOString(),
  user:currentUser.id,userName:currentUser.name,shiftId:shiftId()
 });
 save();render();
}

function closeShift(){
 if(!db.currentShift)return;
 const s=db.currentShift;
 const sales=shiftFilter(db.sales);
 const purchases=shiftFilter(db.purchases);
 const expenses=shiftFilter(db.expenses);
 const moves=shiftFilter(db.cashMoves);

 const saleTotal=sales.reduce((a,x)=>a+x.total,0);
 const buyTotal=purchases.reduce((a,x)=>a+x.total,0);
 const expenseTotal=expenses.reduce((a,x)=>a+x.amount,0);
 const expected=cashExpected();

 const methods={};
 sales.forEach(x=>methods[x.payment]=(methods[x.payment]||0)+x.total);

 openModal(`
 <h2>🔴 Cerrar turno</h2>
 <div class="grid">
  <div class="stat"><span>Fondo inicial</span><b>${money(s.openingCash)}</b></div>
  <div class="stat"><span>Ventas</span><b>${money(saleTotal)}</b></div>
  <div class="stat"><span>Compras</span><b>${money(buyTotal)}</b></div>
  <div class="stat"><span>Gastos</span><b>${money(expenseTotal)}</b></div>
 </div>
 <div class="card" style="margin-top:10px;background:#f7f8f8">
  <b>Ventas por método</b>
  ${Object.entries(methods).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join("")}
 </div>
 <div class="notice">Efectivo esperado: <b>${money(expected)}</b></div>
 <label>Efectivo contado</label>
 <input id="closingCash" type="number" inputmode="decimal" min="0" step=".01">
 <div class="modal-actions">
  <button class="btn secondary" onclick="closeModal()">Cancelar</button>
  <button class="btn danger" onclick="saveShiftClose()">Cerrar turno</button>
 </div>
 `);
}

function saveShiftClose(){
 const counted=Number(document.getElementById("closingCash").value)||0;
 const s=db.currentShift;
 const expected=cashExpected();

 const summary={
  ...s,
  closedAt:new Date().toISOString(),
  closedBy:currentUser.name,
  closingUserId:currentUser.id,
  countedCash:counted,
  expectedCash:expected,
  difference:counted-expected,
  sales:shiftFilter(db.sales).map(x=>({...x})),
  purchases:shiftFilter(db.purchases).map(x=>({...x})),
  expenses:shiftFilter(db.expenses).map(x=>({...x})),
  cashMoves:shiftFilter(db.cashMoves).map(x=>({...x})),
  totalSales:shiftFilter(db.sales).reduce((a,x)=>a+x.total,0),
  totalPurchases:shiftFilter(db.purchases).reduce((a,x)=>a+x.total,0),
  totalExpenses:shiftFilter(db.expenses).reduce((a,x)=>a+x.amount,0)
 };

 db.shifts.push(summary);
 db.cashCuts.push({
  id:uid(),number:db.cashCuts.length+1,
  expectedCash:expected,closingCash:counted,
  difference:counted-expected,date:new Date().toISOString(),
  user:currentUser.id,userName:currentUser.name,shiftId:s.id
 });
 db.currentShift=null;
 save();
 closeModal();
 alert("Turno cerrado.\nDiferencia: "+money(counted-expected));
 render();
}

function getPeriod(){
 const type=document.getElementById("reportPeriod").value;
 const now=new Date();
 let start,end;
 if(type==="today"){start=todayStart();end=todayEnd()}
 else if(type==="week"){
  start=todayStart();start.setDate(start.getDate()-((start.getDay()+6)%7));end=todayEnd();
 }else if(type==="month"){
  start=new Date(now.getFullYear(),now.getMonth(),1);end=new Date(now.getFullYear(),now.getMonth()+1,0,23,59,59,999);
 }else{start=new Date(0);end=new Date(8640000000000000)}
 return {start,end};
}
function inPeriod(d,p){const x=new Date(d);return x>=p.start&&x<=p.end}

function updateReport(){
 const type=document.getElementById("reportType").value;
 const p=getPeriod();

 if(type==="inventory"){renderInventoryReport();return}
 if(type==="cash"){renderCashReport();return}
 if(type==="users"){renderUserReport();return}

 let arr=type==="sales"?db.sales:db.purchases;
 arr=arr.filter(x=>inPeriod(x.date,p));

 if(type==="purchases"){
  const total=arr.reduce((a,x)=>a+x.total,0);
  const kg=arr.reduce((a,x)=>a+(x.kg||0),0)+arr.reduce((a,x)=>a+(x.items||[]).reduce((q,i)=>q+i.kg,0),0);
  document.getElementById("reportResult").innerHTML=`

    <div class="stat"><span>Promedio</span><b>${money(arr.length?total/arr.length:0)}</b></div>
   </div>
   <div class="card" style="margin-top:12px"><h3>Compras</h3>
   ${arr.slice().reverse().map(x=>`<div class="row"><div><b>${(x.items||[]).map(i=>esc(db.materials.find(m=>m.id===i.mid)?.name||"Material")).join(", ")}</b><div class="small">${esc(x.userName)} · ${x.payment} · ${dateTime(x.date)}</div></div><b>${money(x.total)}</b></div>`).join("")||`<div class="empty">Sin compras.</div>`}
   </div>`;
 }else{
  const total=arr.reduce((a,x)=>a+x.total,0);
  const kg=arr.reduce((a,x)=>a+x.kg,0);
  const byPay={};
  arr.forEach(x=>byPay[x.payment]=(byPay[x.payment]||0)+x.total);
  document.getElementById("reportResult").innerHTML=`
   <div class="grid">
    <div class="stat"><span>Total vendido</span><b>${money(total)}</b></div>
    <div class="stat"><span>Kg vendidos</span><b>${kg.toLocaleString()}</b></div>

   ${Object.entries(byPay).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join("")}</div>
   <div class="card"><h3>Ventas</h3>
   ${arr.slice().reverse().map(x=>`<div class="row"><div><b>${esc(db.materials.find(m=>m.id===x.mid)?.name||"Material")}</b><div class="small">${x.kg} kg · ${esc(x.userName)} · ${dateTime(x.date)}</div></div><b>${money(x.total)}</b></div>`).join("")||`<div class="empty">Sin ventas.</div>`}
   </div>`;
 }
}

function addUser(){
 const name=prompt("Nombre del usuario:");
 if(!name)return;
 const pin=prompt("PIN de 4 a 8 números:");
 if(!pin||!/^\d{4,8}$/.test(pin))return alert("PIN inválido.");
 db.users.push({id:uid(),name:name.trim(),pin,role:"Empleado"});
 save();render();
}
function editUser(id){
 const u=db.users.find(x=>x.id===id);
 const name=prompt("Nombre:",u.name);
 if(name)u.name=name.trim();
 const pin=prompt("Nuevo PIN:",u.pin);
 if(pin&&/^\d{4,8}$/.test(pin))u.pin=pin;
 save();render();
}

let trainingState={module:0,step:0,completed:{}};

}

}

function renderTutorial(){
 const m=trainingModules[trainingState.module], s=m.steps[trainingState.step];
 const total=s?m.steps.length:1, pct=Math.round(((trainingState.step+1)/total)*100);
 const done=Object.keys(trainingState.completed).length, all=trainingModules.length;
 document.getElementById("app").innerHTML=`
 <div class="training-wrap">
  <div class="card training-welcome">
   <div class="training-label">🎓 CAPACITACIÓN INTERACTIVA</div>
   <h1>Aprende a utilizar tu sistema</h1>
   <p>Aprende cada función paso a paso y practica directamente dentro del sistema.</p>
   <div class="training-overall"><span style="width:${Math.round(done/all*100)}%"></span></div>
   <div class="training-overall-text">${done} de ${all} lecciones completadas</div>
  </div>
  <div class="training-module-grid">
   ${trainingModules.map((x,i)=>`<button class="training-module ${i===trainingState.module?"selected":""} ${trainingState.completed[x.id]?"completed":""}" onclick="trainingSelect(${i})"><span class="tm-icon">${x.icon}</span><span><b>${x.title}</b><small>${trainingState.completed[x.id]?"✓ Completada":"Lección "+(i+1)}</small></span></button>`).join("")}
  </div>
  <div class="card training-card">
   <div class="training-head">
    <div><div class="training-kicker">LECCIÓN ${trainingState.module+1} DE ${all}</div><h2>${m.icon} ${m.title}</h2><p>${m.desc}</p></div>
    <div class="training-step-count">${trainingState.step+1}/${total}</div>
   </div>
   <div class="training-bar"><span style="width:${pct}%"></span></div>
   <div class="training-instruction">
    <div class="training-big-number">${trainingState.step+1}</div>
    <div class="training-copy">
     <div class="training-action">AHORA HAZ ESTO</div>
     <h3>${esc(s[0])}</h3><p>${esc(s[1])}</p>
     <div class="training-tip"><b>💡 Consejo:</b> ${esc(s[3])}</div>
    </div>
   </div>
   <div class="training-practice-box">
    <div><b>🖱️ ¿Quieres practicar?</b><small>Ve directamente a la función relacionada.</small></div>
    <button class="btn secondary" onclick="trainingPractice('${s[2]}')">Practicar ahora →</button>
   </div>
   <div class="training-nav">
    <button class="btn secondary" ${trainingState.step===0?"disabled":""} onclick="trainingPrev()">← Anterior</button>
    ${trainingState.step<total-1?`<button class="btn" onclick="trainingNext()">Siguiente paso →</button>`:`<button class="btn" onclick="trainingQuiz()">🎯 Terminar y comprobar</button>`}
   </div>
  </div>
  <div class="card training-checklist">
   <h3>📋 Pasos de esta lección</h3>
   ${m.steps.map((x,i)=>`<div class="check-row ${i===trainingState.step?"current":""} ${i<trainingState.step?"past":""}"><span>${i<trainingState.step?"✓":i+1}</span><div><b>${esc(x[0])}</b><small>${i===trainingState.step?"Estás aquí":i<trainingState.step?"Paso completado":"Pendiente"}</small></div></div>`).join("")}
  </div>
 </div>`;
}
function trainingSelect(i){trainingState.module=i;trainingState.step=0;trainingState.started=true;renderTutorial();}
function trainingPrev(){if(trainingState.step>0){trainingState.step--;renderTutorial();}}
function trainingNext(){if(trainingState.step<trainingModules[trainingState.module].steps.length-1){trainingState.step++;renderTutorial();}}
function trainingQuiz(){
 const m=trainingModules[trainingState.module];
 openModal(`<div class="training-quiz"><div class="training-label">🎯 COMPROBACIÓN</div><h2>${m.icon} ${m.title}</h2><p class="quiz-question">${esc(m.quiz)}</p><button class="btn secondary full" onclick="document.getElementById('trainingAnswer').classList.remove('hidden')">👁️ Mostrar respuesta</button><div id="trainingAnswer" class="training-answer hidden"><b>Respuesta correcta:</b><br>${esc(m.answer)}</div><div class="modal-actions"><button class="btn" onclick="trainingMarkComplete()">✓ Entendí la lección</button></div></div>`);
}
function trainingMarkComplete(){
 const m=trainingModules[trainingState.module];
 trainingState.completed[m.id]=true; closeModal();
 if(trainingState.module<trainingModules.length-1){trainingState.module++;trainingState.step=0;alert("✓ Lección completada. Vamos a la siguiente.");}
 else alert("🎉 ¡Capacitación completada! Ya revisaste todas las funciones.");
 renderTutorial();
}

function renderRespaldo(){

 <button class="btn full" onclick="exportData()">Descargar respaldo</button>

 <h2>Restaurar</h2>
 <input id="restoreFile" type="file" accept=".json,application/json">
 <button class="btn full" onclick="importData()">Restaurar respaldo</button>
 <div class="notice">⚠️ El respaldo reemplazará los datos actuales.</div>

}
function exportData(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="recicladora_v14_"+new Date().toISOString().slice(0,10)+".json";
 a.click();
 URL.revokeObjectURL(url);
}
function importData(){
 const file=document.getElementById("restoreFile").files[0];
 if(!file)return alert("Selecciona un respaldo.");
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const data=JSON.parse(reader.result);
   if(!data.business||!Array.isArray(data.materials))throw new Error();
   if(!confirm("¿Reemplazar los datos actuales?"))return;
   db={...clone(DEFAULT_DB),...data};
   save();
   alert("Respaldo restaurado.");
   location.reload();
  }catch(e){alert("El archivo no es válido.")}
 };
 reader.readAsText(file);
}
function factoryReset(){
 const x=prompt("Escribe BORRAR para confirmar:");
 if(x!=="BORRAR")return;
 localStorage.removeItem(KEY);
 location.reload();
}

}
function closeModal(e){
 if(e&&e.target!==e.currentTarget)return;
 document.getElementById("modal").classList.add("hidden");
}
